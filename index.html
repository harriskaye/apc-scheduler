<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple Pie Contest 2026 — Live Volunteer Scheduler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2320;
  --ink-soft:#6b5f57;
  --paper:#faf7f2;
  --card:#ffffff;
  --line:#e7ded3;
  --apple:#b3271e;
  --apple-soft:#fbeae8;
  --orchard:#4a6b3a;
  --orchard-soft:#ecf2e6;
  --amber:#c07d0a;
  --amber-soft:#fdf3df;
  --intern:#3d5a80;
  --intern-soft:#e8eef5;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--paper);
  color:var(--ink);
  line-height:1.5;
}
.wrap{max-width:1400px;margin:0 auto;padding:20px 20px 80px}
h1,h2,h3{font-family:'Fraunces',Georgia,serif}

/* ---------- header ---------- */
header.top{margin-bottom:8px}
.eyebrow{
  font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--apple);font-weight:700;margin-bottom:6px;
}
h1{font-size:clamp(1.3rem,2.6vw,1.8rem);font-weight:900;line-height:1.1;letter-spacing:-.01em}
.srcline{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.pill{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.72rem;font-weight:700;border-radius:999px;padding:4px 12px;
}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill.live{background:var(--orchard-soft);color:var(--orchard)}
.pill.live .dot{background:var(--orchard);animation:pulse 2s infinite}
.pill.snap{background:var(--amber-soft);color:#8a5c06}
.pill.snap .dot{background:var(--amber)}
.pill.err{background:var(--apple-soft);color:var(--apple)}
.pill.err .dot{background:var(--apple)}
.srcline .when{font-size:.72rem;color:var(--ink-soft)}
.refresh{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:4px 12px;font-size:.72rem;font-weight:700;cursor:pointer;color:var(--ink-soft);
  font-family:inherit;
}
.refresh:hover{border-color:var(--ink-soft)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:7px 13px;min-width:88px;
}
.stat .num{font-family:'Fraunces',serif;font-size:1.2rem;font-weight:700;line-height:1.1}
.stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600}
.stat.open .num{color:var(--apple)}
.stat.filled .num{color:var(--orchard)}
.stat.pct .num{color:var(--intern)}

/* ---------- day band ---------- */

.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--apple);z-index:2}
.nowline::after{
  content:"NOW";position:absolute;top:2px;left:4px;
  background:var(--apple);color:#fff;font-size:.55rem;font-weight:800;
  letter-spacing:.06em;border-radius:3px;padding:1px 5px;
}
.lane .nowline{width:1.5px;z-index:1}
.lane .nowline::after{display:none}


/* ---------- filters ---------- */
.controls{position:sticky;top:0;z-index:20;background:var(--paper);padding:10px 0 8px;margin:18px 0 10px;border-bottom:1px solid var(--line)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mini{margin-left:auto;font-size:.8rem;font-weight:700;color:var(--ink-soft);white-space:nowrap}
.filters .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-right:4px}
.chip{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 15px;font-size:.86rem;font-weight:600;cursor:pointer;
  color:var(--ink-soft);font-family:inherit;
}
.chip:hover{border-color:var(--ink-soft)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:focus-visible{outline:3px solid var(--apple);outline-offset:1px}

/* ---------- legend ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft);margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block}

/* ---------- schedule ---------- */
.sched{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto}
.sched-inner{min-width:860px;position:relative}
.timehead{display:flex;height:26px;background:transparent}
.stickyaxis{overflow:hidden;margin-top:6px;border-top:1px solid var(--line);padding-top:2px}
.timehead .rolecol{width:250px;flex:none;border-right:1px solid var(--line)}
.timehead .axis{position:relative;flex:1}
.timehead .axis span{position:absolute;top:6px;font-size:.72rem;font-weight:600;color:var(--ink-soft);transform:translateX(-50%)}
.grouphdr{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;font-family:'Fraunces',serif;font-weight:700;font-size:.95rem;
  border-top:1px solid var(--line);background:#fdfbf8;
  cursor:pointer;user-select:none;
}
.grouphdr:hover{background:#faf5ec}
.grouphdr .chev{font-size:.7rem;color:var(--ink-soft);width:12px;flex:none;transition:transform .15s}
.grouphdr.closed .chev{transform:rotate(-90deg)}
.gprog{flex:0 0 80px;height:5px;border-radius:3px;background:#e9e1d5;overflow:hidden;margin-left:auto}
.gprog i{display:block;height:100%;background:var(--orchard)}
.grouphdr{scroll-margin-top:118px}
.rolecol .newtag{background:var(--apple);color:#fff;border-radius:3px;font-size:.55rem;font-weight:700;padding:1px 4px;margin-left:6px;display:inline-block;vertical-align:1px}
.gpct{font-family:'Public Sans',sans-serif;font-size:.76rem;font-weight:700;color:var(--orchard);min-width:34px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.grouphdr .cnt{font-family:'Public Sans',sans-serif;font-size:.76rem;font-weight:600;color:var(--ink-soft)}
.row{display:flex;min-height:40px;align-items:center;border-top:1px dashed #f0e9df;cursor:pointer}
.row:hover{background:#fdfaf5}
.row.rfilled{background:#f3f7ee}
.row.rfilled:hover{background:#ecf3e4}
.row.rfilled.rintern{background:#eff3f8}
.row.rfilled.rintern:hover{background:#e6edf5}
.row.rpend{background:#fdf8ec}
.row.rpend:hover{background:#faf2df}
.row.rext{background:#e9e6df}
.row.rext:hover{background:#e2ded5}
.name.pend{color:#8a5c06 !important}
.bar.pend{background:var(--amber-soft);color:#8a5c06;border:1.5px dashed var(--amber)}
.bar.ext{background:#eae6de;color:#6e6357;border:1.5px dashed #a2957f}
.stat.pend .num{color:var(--amber)}
.detail .assignee.pend{background:var(--amber-soft);color:#8a5c06}
.signupbox{display:none;margin:4px 0 14px;padding:12px;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.signupbox input{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:.92rem;font-family:inherit;margin-bottom:8px;background:var(--card)}
.signupbox input:focus{outline:2px solid var(--ink);border-color:var(--ink)}
.signupbox button{background:var(--apple);color:#fff;font-weight:700;border:none;border-radius:8px;padding:10px 18px;font-size:.92rem;cursor:pointer;font-family:inherit}
.signupbox button:hover{background:#9c2218}
.signupbox button:disabled{opacity:.6;cursor:default}
.sumsg{font-size:.85rem;font-weight:600;margin-top:8px;color:var(--ink)}
.notedot{color:var(--ink-soft);font-size:.7rem;margin-left:5px;opacity:.7}
.row .rolecol{
  width:250px;flex:none;padding:6px 12px;font-size:.86rem;font-weight:600;
  border-right:1px solid var(--line);line-height:1.25;
}
.row .rolecol .name{display:block;font-weight:700;font-size:.8rem;color:var(--ink);margin-top:2px}
.whochip{
  display:inline-block;background:#dbe7ca;color:#3a5a2b;
  border-radius:6px;padding:1px 9px;font-weight:700;font-size:.78rem;line-height:1.5;
}
.whochip.intern{background:#d7e2f0;color:#30517c}
.whochip:hover{filter:brightness(.93);cursor:pointer}
#personSelect{
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 12px;font-size:.84rem;font-weight:600;color:var(--ink-soft);
  font-family:inherit;cursor:pointer;max-width:230px;
}
#personSelect:hover{border-color:var(--ink-soft)}
.row .rolecol .name.miss{font-weight:400;color:var(--ink-soft)}
.row .lane{position:relative;flex:1;height:40px}
.bar{
  position:absolute;top:8px;height:24px;border-radius:6px;
  font-size:.74rem;font-weight:700;color:#fff;
  display:flex;align-items:center;padding:0 7px;
  white-space:nowrap;overflow:hidden;cursor:pointer;
  border:none;font-family:inherit;
}
.bar:focus-visible{outline:3px solid var(--ink);outline-offset:1px}
.bar.tight{font-size:.68rem;padding:0 3px;justify-content:center;letter-spacing:-.01em}
.bar.filled{background:var(--orchard)}
.bar.open{background:var(--apple-soft);color:var(--apple);border:1.5px dashed var(--apple)}
.bar.intern.filled{background:var(--intern)}
.bar.intern.open{background:var(--intern-soft);color:var(--intern);border:1.5px dashed var(--intern)}
.bar.est{opacity:.85}
.bar .newtag{background:var(--apple);color:#fff;border-radius:3px;font-size:.55rem;padding:1px 4px;margin-left:5px;flex:none}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:#f3ede4;z-index:0}
.gridline.hour{background:#e9e1d5}
.emptystate{padding:30px;text-align:center;color:var(--ink-soft);font-size:.85rem}

/* ---------- detail panel ---------- */
.backdrop{
  position:fixed;inset:0;background:rgba(43,35,32,.45);
  opacity:0;pointer-events:none;transition:opacity .18s ease;z-index:49;
}
.backdrop.on{opacity:1;pointer-events:auto}
.detail{
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.96);opacity:0;pointer-events:none;
  width:min(560px,92vw);max-height:78vh;overflow-y:auto;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  padding:22px 24px 26px;transition:opacity .18s ease, transform .18s ease;
  z-index:50;
}
.detail.openp{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.detail .close{position:absolute;top:10px;right:14px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--ink-soft);font-family:inherit}
.detail h3{font-size:1.1rem;margin-bottom:2px;padding-right:30px}
.detail .assignee{
  display:inline-flex;align-items:center;gap:8px;margin:8px 0 10px;
  background:var(--orchard-soft);color:var(--orchard);
  border-radius:999px;padding:5px 14px;font-size:.85rem;font-weight:700;
}
.detail .assignee.none{background:var(--apple-soft);color:var(--apple)}
.detail .meta{font-size:.86rem;color:var(--ink-soft);margin-bottom:10px}
.detail .notes{font-size:.95rem;line-height:1.55;white-space:pre-wrap;max-width:760px}

@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="eyebrow">Pleasantville Farmers Market</div>
  <h1>Apple Pie Contest 2026<br>Volunteer Scheduler</h1>
  <div class="srcline">
    <span class="pill snap" id="srcPill"><span class="dot"></span><span id="srcText">Loading…</span></span>
    <span class="when" id="srcWhen"></span>
    <button class="refresh" id="refreshBtn">↻ Refresh</button>
    <button class="refresh" id="dayofBtn">☀ Day-of view</button>
  </div>
  <div class="stats" id="stats"></div>
</header>

<section aria-label="Full schedule">
  <div class="controls">
  <div class="filters" id="filters" role="group" aria-label="Filter roles">
    <span class="lbl">Show</span>
    <button class="chip on" data-f="all">All roles</button>
    <button class="chip" data-f="open">Open roles</button>
    <button class="chip" data-f="filled">Filled roles</button>
    <button class="chip" data-f="adult">Adult roles</button>
    <button class="chip" data-f="intern">Intern roles</button>
    <select id="personSelect" aria-label="View one person's day">
      <option value="">👤 View someone's day…</option>
    </select>
    <span class="mini" id="miniStat"></span>
  </div>
  <div class="legend">
    <span><i class="swatch" style="background:var(--orchard)"></i>Filled</span>
    <span><i class="swatch" style="background:var(--apple-soft);border:1.5px dashed var(--apple)"></i>Open — click to sign up</span>
    <span><i class="swatch" style="background:var(--intern)"></i>Intern shift</span>
    <span><i class="swatch" style="background:#eae6de;border:1.5px dashed #a2957f"></i>External sign-up</span>
  </div>
  <div class="stickyaxis"><div class="timehead" id="stickyHead"><div class="rolecol"></div><div class="axis" id="saAxis"></div></div></div>
  </div>
  <div class="sched"><div class="sched-inner" id="sched"></div></div>
</section>

</div>

<div class="backdrop" id="backdrop"></div>
<div class="detail" id="detail" role="dialog" aria-modal="true" aria-label="Role details">
  <button class="close" id="detailClose" aria-label="Close details">×</button>
  <h3 id="dTitle"></h3>
  <div><span class="assignee" id="dWho"></span></div>
  <div class="meta" id="dMeta"></div>
  <div class="signupbox" id="signupBox">
    <input type="text" id="suName" placeholder="Your name" maxlength="80" autocomplete="name">
    <input type="text" id="suNote" placeholder="Note (optional)" maxlength="200">
    <button id="suGo">👋 Sign up for this role</button>
    <div class="sumsg" id="suMsg"></div>
  </div>
  <div class="notes" id="dNotes"></div>
</div>

<script>
/* =====================================================================
   AIRTABLE CONFIG — fill these in once your base is set up.
   Leave AIRTABLE.enabled = false to run purely on the built-in snapshot.

   Table fields expected (see the seed CSV that ships with this file):
     Role (single line text)         — role title
     Area (single select)           — must match an AREA_ORDER value below
     Start (single line text)       — 24h "H:MM", e.g. "7:30" or "13:00"
     End (single line text)         — 24h "H:MM"
     Assigned To (single line text) — leave blank = open, a name = filled
     Intern (checkbox)
     New 2026 (checkbox)
     End Estimated (checkbox)
     Notes (long text)
     Sort (number)                  — display order within the area

   SECURITY NOTE: a token pasted here is visible to anyone who views
   source on this page. Use a Personal Access Token scoped to
   *read-only* (data.records:read) on *this one base* — or better,
   point apiUrl at a small Vercel serverless proxy that holds the
   token server-side (same pattern as the inspection map).
   ===================================================================== */
const AIRTABLE = {
  enabled: true,
  baseId:  "",       // not needed — the proxy knows the base
  table:   "",       // not needed — the proxy knows the table
  token:   "",       // never in this file; lives in a Vercel environment variable
  apiUrl:  "/api/roles"
};

const AREA_ORDER = [
  "Pre-Market Operations",
  "Pre-Event Prep",
  "Sign-In Table",
  "Gazebo — Judging",
  "Results & Announcement",
  "Pie Sales",
  "Market Support",
  "End of Day"
];

const DAY_START = 4.5, DAY_END = 13.5;

/* ---------------- built-in snapshot (from the 2026 xlsx) ---------------- */
/* Same shape the Airtable loader produces, so rendering is identical.     */
const SNAPSHOT = [
 // area, role, start, end, who, intern, isnew, est, notes
 ["Pre-Market Operations","Gazebo Set-up","5:30","6:10","Harris",0,0,1,""],
 ["Pre-Market Operations","DPW","6:10","7:15","DPW",0,0,1,"Cones, garbage cans, table drop, music area set-up."],
 ["Pre-Market Operations","Morning Ops (Intern)","7:15","9:30","",1,0,0,"After normal tasks, assist with pie tasks if needed."],
 ["Pre-Market Operations","Morning Ops (Intern)","7:15","9:30","",1,0,0,""],
 ["Pre-Market Operations","Morning Ops (Intern)","7:15","9:30","",1,0,0,""],
 ["Pre-Event Prep","Pre-Event Supervision & Prep — Pie Check-in","7:30","8:00","Shar",0,0,0,"Pie check-in area setup: 3 wrought-iron tables for pie drop-off, 2 behind for work area, tablecloths, 40 × $10 market bucks for bakers, cash box, pie plate number reminders, number stickers (4 of each), blue tape backup, free slice coupons (2 per baker), signage, paper towels, hot pads, wet wipes. Hands off into Head of Sign-In at 8:00."],
 ["Pre-Event Prep","Pre-Event Supervision & Prep — Gazebo","7:30","8:15","Yvonne L",0,0,0,"Gazebo: place judge tasting supplies (forks, plates, napkins); garbage bin easily accessible; keep traffic flow clear at peak judge time. Hands off into Head of Gazebo at 8:15."],
 ["Pre-Event Prep","Prize Collection","7:30","9:30","Sharon",0,0,0,""],
 ["Pre-Event Prep","Prize Collection","7:30","9:30","Joe",0,0,0,""],
 ["Pre-Event Prep","Prize Bag Packer","7:30","9:30","Marlene",0,0,0,""],
 ["Pre-Event Prep","Photographer","8:15","12:00","",0,0,0,"Have extra copies of shoot list to provide."],
 ["Sign-In Table","Head of Sign-In","8:00","10:00","Shar",0,0,1,"Owns all aspects of sign-in tent. Briefs helpers ahead of contest day. Brings printed reports (registration, pending payment, last-minute changes, coupons). Communicates pie/category ID changes to gazebo team so pies land in the right judging station. After last check-in, hands the pie-plate number + baker bio list to the Pie Plate Pick-up table."],
 ["Sign-In Table","Sign-In Coordinator 1 — Traditional","7:45","9:45","",0,0,0,"Traditional pie check-in. Verify: no decorations beyond air vents (designs move to Decorative); 9–10\" pie plate; display-ready, no containers/lids. Label plate bottom, rim, and baker reminder slip — lowest number first. Give: $10 MB, number reminder, 2 free slice coupons, day schedule. After check-in, pack supplies into bins; leave tables (they become pie plate pick-up)."],
 ["Sign-In Table","Sign-In Coordinator 2 — Decorative","7:45","9:45","",0,0,0,"Decorative pie check-in. Verify 9–10\" plate; display-ready. Same labeling and hand-outs as Traditional."],
 ["Sign-In Table","Sign-In Coordinator 3 — Apple Crisp","7:45","9:45","",0,0,0,"Apple crisp check-in. Verify: streusel topping, no bottom crust; 9–10\" plate; display-ready. Same labeling and hand-outs."],
 ["Gazebo — Judging","Head of Gazebo","8:15","10:45","Yvonne L",0,0,0,"Owns pie transport from sign-in to gazebo placement. Every pie must display its ID sticker. Covers pies with mesh (bees), removes when Peter greenlights judging. During judging: collect garbage, replenish forks, keep area presentable, stay out of judges' paths. Heads to Music Tent for closing ceremony once winners are set."],
 ["Gazebo — Judging","Assistant Head of Gazebo #1","8:15","11:00","",0,0,0,""],
 ["Gazebo — Judging","Assistant Head of Gazebo #2","8:15","11:00","",0,0,0,""],
 ["Gazebo — Judging","Judge Greeter","9:00","10:00","",0,1,1,"NEW FOR 2026 · Music Tent area. Supplies: judge list, pens, clipboard, coffee coupons, judge swag bags, judge schedule notes. Greets judges, hands out thank-you swag bag + coffee coupon, shows them their IDs, quick market tour if time allows."],
 ["Gazebo — Judging","Contest Scoring","9:00","10:45","Peter",0,0,1,"Equipment: laptop. Manages all formal scoring, winner designation, announcements. Briefs volunteer judges on rules, hands out clipboards, collects waivers, assigns pie categories. Reviews submitted rankings. Greenlights the gazebo team to mark winning pies. Runs to Music Tent for announcement, awards, photos, ceremony close."],
 ["Gazebo — Judging","Score Enterer 1 (Team 1)","9:00","10:45","",0,0,0,"Two-person teams: one reads scores aloud, one enters into the spreadsheet (laptop provided). Read, enter, double-check — bad handwriting makes mistakes easy."],
 ["Gazebo — Judging","Score Enterer 2 (Team 1)","9:00","10:45","",0,0,0,""],
 ["Gazebo — Judging","Score Enterer 3 (Team 2)","9:00","10:45","",0,1,0,"Second entry team added for 2026."],
 ["Gazebo — Judging","Score Enterer 4 (Team 2)","9:00","10:45","",0,1,0,""],
 ["Gazebo — Judging","Score Sheet Checker","9:00","10:45","",0,0,0,"Reviews every completed judge scoresheet: all assigned pies judged, scores legible and valid (no half scores), nothing missed. ~30 minutes of intense activity when all 14 judges finish at once. Needs serious detail orientation."],
 ["Gazebo — Judging","Pie Slicer for Judges 1","9:15","10:45","",0,0,0,"Gloves out and ready. Peter greenlights after decorative pies are viewed. Judging phase: cut and serve ONE slice per judge tasting."],
 ["Gazebo — Judging","Pie Slicer for Judges 2","9:15","10:45","",0,0,0,""],
 ["Gazebo — Judging","Pie Slicer for Judges 3","9:15","10:45","",0,0,0,""],
 ["Results & Announcement","Tabulator","10:20","10:45","Peter",0,0,0,"Texts Harris the sheets so he has info for post-event."],

 ["Results & Announcement","MC Results","10:50","11:15","Yvonne L",0,0,0,""],
 ["Results & Announcement","MC Results","10:50","11:15","Shar",0,0,0,""],
 ["Pie Sales","Head of Slicing (Sales Phase)","10:45","11:15","",0,0,0,"Slicing begins only after Peter confirms all 9 winners — judges then released. Winning pies stay at gazebo until moved to sales. Vendor slices held aside with thank-you notes. Keep sliced pies in their original row + category."],

/* ---------------- helpers ---------------- */
const pct = h => ((h - DAY_START) / (DAY_END - DAY_START) * 100);
function parseTime(s){
  if(typeof s === "number") return s;
  const m = String(s).trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm|a|p)?\.?m?\.?$/i);
  if(!m) return null;
  let h = +m[1];
  const mn = m[2] ? (+m[2])/60 : 0;
  const ap = (m[3]||"").toLowerCase();
  if(ap.startsWith("p") && h < 12) h += 12;
  else if(ap.startsWith("a") && h === 12) h = 0;
  else if(!ap && h >= 1 && h <= 3) h += 12; // bare 1:00–3:59 = afternoon (market day runs 4:30 AM–1:30 PM)
  return h + mn;
}
function fmt(h){
  let hr = Math.floor(h), mn = Math.round((h-hr)*60);
  if(mn===60){hr++;mn=0}
  const ap = hr>=12 ? "PM" : "AM";
  let h12 = hr%12; if(h12===0) h12=12;
  return h12 + (mn? ":"+String(mn).padStart(2,"0") : ":00") + " " + ap;
}
function status(role){
  const w = (role.who||"").trim();
  return (w && w.toUpperCase() !== "TBD") ? "filled" : "open";
}

/* ---------------- state ---------------- */
let ROLES = [];         // flat, normalized
let currentFilter = "all";
let personFilter = null;
let dayofOn = false;
let dayofTimer = null;
const collapsed = new Set();

const EXTERNAL_ROLES = ["Manager's Tent Shift 1","Manager's Tent Shift 2","EOD Shed","Music Stage Manager"];
function normalizeSnapshot(){
  return SNAPSHOT.map((r,i)=>({
    area:r[0], role:r[1], start:parseTime(r[2]), end:parseTime(r[3]),
    who:r[4], intern:!!r[5], isnew:!!r[6], est:!!r[7], notes:r[8]||"",
    external: EXTERNAL_ROLES.includes(r[1]), sort:i
  }));
}

async function loadAirtable(fresh){
  const headers = {};
  let url;
  if(AIRTABLE.apiUrl){
    url = AIRTABLE.apiUrl + (fresh ? "?fresh=" + Date.now() : "");
  } else {
    url = `https://api.airtable.com/v0/${AIRTABLE.baseId}/${encodeURIComponent(AIRTABLE.table)}?pageSize=100`;
    headers["Authorization"] = "Bearer " + AIRTABLE.token;
  }
  let records = [], signups = [], offset = null, guard = 0;
  do{
    const res = await fetch(url + (offset ? (url.includes("?")?"&":"?") + "offset="+offset : ""), {headers});
    if(!res.ok) throw new Error("Airtable HTTP " + res.status);
    const data = await res.json();
    records = records.concat(data.records || []);
    if(data.signups) signups = data.signups;
    offset = data.offset || null;
  } while(offset && ++guard < 10);

  const out = records.map((rec,i)=>{
    const f = rec.fields || {};
    return {
      area: f["Area"] || "Unsorted",
      role: f["Role"] || "(unnamed role)",
      start: parseTime(f["Start"]),
      end: parseTime(f["End"]),
      who: f["Assigned To"] || "",
      intern: !!f["Intern"],
      external: !!f["External"],
      isnew: !!f["New 2026"],
      est: !!f["End Estimated"],
      notes: f["Notes"] || "",
      sort: (typeof f["Sort"]==="number") ? f["Sort"] : 1000+i
    };
  }).filter(r => r.start!==null && r.end!==null);
  if(!out.length) throw new Error("No usable records");
  return {roles: out, signups};
}

// only a "New" signup claims an open row — "Approved" rows are just the log of
// completed signups (history), and "Declined" is ignored entirely
function applyPending(signups){
  (signups||[]).forEach(sg=>{
    if(sg.status !== "New") return;
    if(!sg.role) return;
    const r = ROLES.find(x => x.role === sg.role && status(x) === "open" && !x.pending);
    if(r) r.pending = (sg.name || "someone").trim();
  });
}

function setSource(mode, msg){
  const pill = document.getElementById("srcPill");
  const txt = document.getElementById("srcText");
  pill.className = "pill " + (mode==="live" ? "live" : mode==="err" ? "err" : "snap");
  txt.textContent = msg;
  document.getElementById("srcWhen").textContent =
    "Updated " + new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
}

async function load(fresh){
  if(AIRTABLE.enabled){
    setSource("snap","Connecting to Airtable…");
    try{
      const res = await loadAirtable(fresh);
      ROLES = res.roles;
      applyPending(res.signups);
      setSource("live","Live from Airtable");
    }catch(err){
      console.error("Airtable load failed:", err);
      ROLES = normalizeSnapshot();
      setSource("err","Airtable unreachable — showing built-in snapshot");
    }
  } else {
    ROLES = normalizeSnapshot();
    setSource("snap","Built-in snapshot (Airtable not connected)");
  }
  renderStats();
  renderSched();
}

/* ---------------- stats ---------------- */
function renderStats(){
  let total=ROLES.length, interns=0, adultFilled=0, pending=0;
  ROLES.forEach(r=>{
    if(r.intern) interns++;
    else if(status(r)==="filled") adultFilled++;
    if(r.pending) pending++;
  });
  const adults = total - interns;
  const filled = adultFilled + ROLES.filter(r=>r.intern && status(r)==="filled").length;
  const open = total - filled;
  const pc = total ? Math.round(filled/total*100) : 0;
  // Filled / Still open / Staffed count EVERY role (adult + intern);
  // the Adult/Intern cards show the composition
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="num">${adults}</div><div class="lbl">Adult roles</div></div>
    <div class="stat pct"><div class="num">${interns}</div><div class="lbl">Intern shifts</div></div>
    <div class="stat filled"><div class="num">${filled}</div><div class="lbl">Filled</div></div>
    <div class="stat open"><div class="num">${open}</div><div class="lbl">Still open</div></div>
    <div class="stat pct"><div class="num">${pc}%</div><div class="lbl">Staffed</div></div>
    ${pending ? `<div class="stat pend"><div class="num">${pending}</div><div class="lbl">Requested</div></div>` : ""}`;
  const mini = document.getElementById("miniStat");
  if(mini) mini.textContent = `${filled}/${total} filled \u00b7 ${pc}%`;
  // (re)fill the person dropdown from current assignments
  const sel = document.getElementById("personSelect");
  if(sel){
    const names = [...new Set(ROLES.map(r=>(r.who||"").trim()).filter(n=>n && n.toUpperCase()!=="TBD"))].sort();
    const cur = personFilter || "";
    sel.innerHTML = '<option value="">👤 View someone\'s day\u2026</option>' +
      names.map(n=>`<option value="${n.replace(/"/g,"&quot;")}"${n===cur?" selected":""}>${n}</option>`).join("");
  }
}

function nowHours(){
  const d = new Date();
  return d.getHours() + d.getMinutes()/60;
}
/* ---------------- schedule ---------------- */
function match(r){
  if(personFilter && (r.who||"").trim() !== personFilter) return false;
  const s = status(r);
  switch(currentFilter){
    case "open": return s!=="filled";
    case "filled": return s==="filled";
    case "adult": return !r.intern;
    case "intern": return !!r.intern;
    default: return true;
  }
}

function groupRoles(){
  const byArea = {};
  ROLES.forEach(r=>{ (byArea[r.area] = byArea[r.area] || []).push(r); });
  const areas = AREA_ORDER.filter(a=>byArea[a]);
  Object.keys(byArea).forEach(a=>{ if(!areas.includes(a)) areas.push(a); });
  return areas.map(a=>({name:a, roles:byArea[a].sort((x,y)=>x.sort-y.sort)}));
}

function renderSched(){
  const sched = document.getElementById("sched");
  // hour axis lives in the sticky bar so it stays visible while scrolling
  let ax = "";
  for(let h=5; h<=13; h++) ax += `<span style="left:${pct(h)}%">${fmt(h)}</span>`;
  document.getElementById("saAxis").innerHTML = ax;
  let html = "";

  let shown = 0;
  groupRoles().forEach((g,gi)=>{
    const roles = g.roles.filter(match);
    if(!roles.length) return;
    const openCt = roles.filter(r=>status(r)!=="filled").length;
    const filledPct = Math.round((roles.length-openCt)/roles.length*100);
    const isClosed = collapsed.has(g.name);
    html += `<div class="grouphdr ${isClosed?'closed':''}" data-grp="${g.name}" id="grp-${gi}" role="button" tabindex="0" aria-expanded="${!isClosed}"><span class="chev">▾</span>${g.name} <span class="cnt">${openCt ? openCt+' of '+roles.length+' open' : 'all '+roles.length+' filled'}</span><span class="gprog"><i style="width:${filledPct}%"></i></span><span class="gpct">${filledPct}%</span></div>`;
    if(isClosed) return;
    roles.forEach(r=>{
      shown++;
      const s = status(r);
      const idx = ROLES.indexOf(r);
      html += `<div class="row ${s==="filled" ? (r.intern ? "rfilled rintern" : "rfilled") : (r.pending ? "rpend" : (r.external ? "rext" : ""))}" data-role="${idx}" title="Click for role details">
        <div class="rolecol">${r.role}${r.notes?'<span class="notedot">ⓘ</span>':''}${r.isnew?'<span class="newtag">NEW</span>':''}<span class="name ${s==="filled"?"":(r.pending?"pend":"miss")}">${s==="filled" ? `<span class="whochip ${r.intern?'intern':''}">${r.who}</span>` : (r.pending ? "⏳ " + r.pending + " — pending" : " ")}</span></div>
        <div class="lane">`;
      for(let h=5; h<=13; h++) html += `<div class="gridline hour" style="left:${pct(h)}%"></div>`;
      if(dayofOn){ const nh = nowHours(); if(nh > DAY_START && nh < DAY_END) html += `<div class="nowline" style="left:${pct(nh)}%"></div>`; }
      const left = Math.max(pct(r.start), 0);
      const fullTimes = fmt(r.start) + "–" + fmt(r.end) + (r.est ? " est." : "");
      // bars are always TRUE length (micro bars get just enough width for a compact
      // label); each bar renders its full label and fitBarLabels() downgrades to the
      // compact form only where the text genuinely doesn't fit
      const durB = r.end - r.start;
      const trueW = pct(r.end)-pct(r.start);
      const width = durB < 0.45 ? Math.max(trueW, 7.0) : Math.max(trueW, 1.2);
      const compact = h => fmt(h).replace(/ [AP]M$/, "");
      const altLabel = compact(r.start) + "–" + compact(r.end);
      html += `<button class="bar ${s} ${(r.external && s!=="filled")?"ext":""} ${r.pending?'pend':''} ${r.intern?'intern':''} ${r.est?'est':''}" style="left:${left}%;width:${width}%" data-role="${idx}" data-full="${fullTimes}" data-alt="${altLabel}" title="${r.role} · ${fullTimes}">${fullTimes}</button>`;
      html += `</div></div>`;
    });
  });
  if(!shown) html += `<div class="emptystate">No roles match this filter.</div>`;
  sched.innerHTML = html;
  syncStickyAxis();
  fitBarLabels();
}

function syncStickyAxis(){
  const head = document.getElementById("stickyHead");
  const inner = document.getElementById("sched");
  if(!head || !inner) return;
  head.style.width = inner.getBoundingClientRect().width + "px";
  head.style.transform = `translateX(${-inner.parentElement.scrollLeft}px)`;
}

// try the full label in each bar; where it overflows, fall back to the compact form
function fitBarLabels(){
  document.querySelectorAll(".bar").forEach(b=>{
    b.classList.remove("tight");
    b.textContent = b.dataset.full;
    if(b.scrollWidth > b.clientWidth + 2){
      b.classList.add("tight");
      b.textContent = b.dataset.alt;
    }
  });
}
let fitTimer;
window.addEventListener("resize", ()=>{ clearTimeout(fitTimer); fitTimer = setTimeout(()=>{ fitBarLabels(); syncStickyAxis(); }, 150); });
document.querySelector(".sched").addEventListener("scroll", syncStickyAxis);

/* ---------------- day-of view: the NOW line ---------------- */
function renderDayof(){
  if(!dayofOn) return;
  renderSched();
}
function toggleDayof(){
  dayofOn = !dayofOn;
  document.getElementById("dayofBtn").textContent = dayofOn ? "✕ Hide NOW line" : "☀ Day-of view";
  if(dayofOn){
    renderDayof();
    dayofTimer = setInterval(renderDayof, 60000);
  } else {
    clearInterval(dayofTimer);
    renderSched();
  }
}

/* ---------------- instant signup ---------------- */
async function doSignup(){
  const box = document.getElementById("signupBox");
  const name = document.getElementById("suName").value.trim();
  const note = document.getElementById("suNote").value.trim();
  const msg = document.getElementById("suMsg");
  const go = document.getElementById("suGo");
  if(!name){ msg.textContent = "Please enter your name first."; return; }
  go.disabled = true; go.textContent = "Signing you up…";
  try{
    const res = await fetch("/api/signup", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({role: box.dataset.role, name, note})
    });
    const data = await res.json();
    if(data.ok){
      msg.textContent = "🎉 You're in, " + name + "! Updating the schedule…";
      // show it instantly from what we already know, then confirm against Airtable
      const rr = ROLES.find(x => x.role === box.dataset.role && status(x) === "open" && !x.pending);
      if(rr){ rr.who = name; renderStats(); renderSched(); }
      await load(true);
      setTimeout(()=>{
        detail.classList.remove("openp");
        document.getElementById("backdrop").classList.remove("on");
      }, 900);
    } else if(data.reason === "taken"){
      msg.textContent = "Sorry — someone just grabbed this one! Pick another open role.";
      go.disabled = false; go.textContent = "👋 Sign up for this role";
      await load(true);
    } else {
      throw new Error(data.reason || "unknown");
    }
  }catch(err){
    msg.textContent = "Couldn't sign up right now — try again, or email Harris.";
    go.disabled = false; go.textContent = "👋 Sign up for this role";
  }
}

/* ---------------- interactions ---------------- */
const detail = document.getElementById("detail");
function setPerson(name){
  personFilter = name || null;
  currentFilter = "all";
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.f==="all"));
  const sel = document.getElementById("personSelect");
  if(sel) sel.value = name || "";
  renderSched();
}

document.addEventListener("click", e=>{
  const who = e.target.closest(".whochip");
  if(who){ setPerson(who.textContent.trim()); return; }
  const bar = e.target.closest(".bar") || e.target.closest(".row[data-role]");
  if(bar){
    const r = ROLES[+bar.dataset.role];
    if(!r) return;
    const s = status(r);
    document.getElementById("dTitle").textContent = r.role + (r.isnew ? "  ·  NEW 2026" : "");
    const who = document.getElementById("dWho");
    who.className = "assignee " + (s==="filled" ? "" : (r.pending ? "pend" : "none"));
    who.textContent = s==="filled" ? "👤 " + r.who
      : (r.pending ? "⏳ Requested by " + r.pending + " — pending confirmation"
                   : (r.external ? "📋 External sign-up"
                   : (r.intern ? "🎓 Intern shift"
                               : "○ Unfilled — needs a volunteer")));
    const box = document.getElementById("signupBox");
    if(s==="open" && !r.pending && !r.intern && !r.external){
      box.style.display = "block";
      box.dataset.role = r.role;
      document.getElementById("suName").value = "";
      document.getElementById("suNote").value = "";
      document.getElementById("suMsg").textContent = "";
      document.getElementById("suGo").disabled = false;
      document.getElementById("suGo").textContent = "👋 Sign up for this role";
    } else {
      box.style.display = "none";
    }
    document.getElementById("dMeta").textContent =
      r.area + " · " + fmt(r.start) + "–" + fmt(r.end) + (r.est?" (end estimated)":"") + (r.intern ? " · Intern role" : "");
    document.getElementById("dNotes").textContent = r.notes || "No detailed description yet — add one in the Notes field in Airtable.";
    detail.classList.add("openp");
    document.getElementById("backdrop").classList.add("on");
    return;
  }
  const ghdr = e.target.closest(".grouphdr");
  if(ghdr){
    const a = ghdr.dataset.grp;
    if(collapsed.has(a)) collapsed.delete(a); else collapsed.add(a);
    renderSched();
    return;
  }
  const chip = e.target.closest(".chip");
  if(chip){
    personFilter = null;
    const psel = document.getElementById("personSelect"); if(psel) psel.value = "";
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));
    chip.classList.add("on");
    currentFilter = chip.dataset.f;
    renderSched();
    return;
  }
  if(e.target.id==="suGo"){ doSignup(); return; }
  if(e.target.id==="refreshBtn"){ load(); return; }
  if(e.target.id==="dayofBtn"){ toggleDayof(); return; }
  if(e.target.id==="detailClose" || (!e.target.closest(".detail") && detail.classList.contains("openp"))){
    detail.classList.remove("openp");
    document.getElementById("backdrop").classList.remove("on");
  }
});
document.addEventListener("change", e=>{
  if(e.target.id === "personSelect") setPerson(e.target.value || null);
});

document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ detail.classList.remove("openp"); document.getElementById("backdrop").classList.remove("on"); }
  if(e.key==="Enter" && (e.target.id==="suName" || e.target.id==="suNote")) doSignup();
  if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("grouphdr")){
    e.preventDefault(); e.target.click();
  }
});

load().then(()=>{ if(dayofOn) renderDayof(); });

// background sync: quietly re-pull every 60s so other viewers see new signups
// without refreshing. Skips hidden tabs and moments when the detail popup is open.
setInterval(()=>{
  if(document.visibilityState === "visible" && !detail.classList.contains("openp")){
    load();
  }
}, 60000);
</script>
